<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Conversion</title>
</head>
<body>
    <script>

        // 3 minutes

        // 1. Create a variable PLAYER_1_SCORE with string value of 109992

        let PLAYER_1_SCORE = '109992';

        // 2. Use any Number conversion method to covert PLAYER_1_SCORE to number data type

        PLAYER_1_SCORE = Number(PLAYER_1_SCORE);

        // 3. Create a new variable of TOP_PLAYER_SCORE with number value of 99989999

        let TOP_PLAYER_SCORE = 99989999;

        // 4. Create a new variable beatTopPlayerScore with value of comparing PLAYER_1_SCORE and TOP_PLAYER_SCORE

        let beatTopPlayerScore = PLAYER_1_SCORE > TOP_PLAYER_SCORE;

        // 5. Use console.log() to output the result of beatTopPlayerScore

        console.log(beatTopPlayerScore);

    </script>
</body>
</html>
