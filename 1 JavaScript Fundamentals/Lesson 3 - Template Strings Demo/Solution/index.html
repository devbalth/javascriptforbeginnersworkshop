<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Strings</title>
</head>
<body>
    <script>

        // 5 minutes

        // 1. Create a variable introduction with value of 'My Name is'

        let introduction = 'My name is';

        // 2. Create a variable name with value of any name
        
        let name = 'Mario';
        
        // 3. Use console.log to log both the introduction and name variable using concatenate method
        
        console.log(introduction + ' ' + name);
        
        // 4. Now create a new variable completeIntroduction and use template strings

        let completeIntroduction = `${introduction} ${name}`;


        // 5. Use console.log to log the completeIntroduction

        console.log(completeIntroduction);
        

    </script>
</body>
</html>
