<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Object</title>
</head>
<body>
    <script>

        /* 
        
            2 minutes
            
            #1 Create a variable of counter with number value of 0

            #2 Create a variable stopAtNumber with value of 78

            #2 Create an undefined variable called generateRandomNumber

            #3 Use while loop to loop through until its condition is equal to 78, if 
               its not equal to, keep looping

               Make sure to update the counter by +1
               Overwrite the value of generateRandomNumber by randomly generating random number from 0 - 100
               Also log the current Generate Random Number

            #4 Finally use console.log() to log 'It takes about x amount to reach stopAtNumber value'
    

        */ 

        /*

            Learning Section:

            while(condition){ code execute }

            A while loop will keep on looping until the condition is false
            then it will stop the loop. Also becareful with your condition
            as it can create an infinite loop which may crash the application.

        */

        // Type your code below:

        let counter = 0;

        let stopAtNumber = 78;

        let generateRandomNumber;

        while(generateRandomNumber !== stopAtNumber){
            counter += 1;
            generateRandomNumber = Math.floor(Math.random() * 100) + 1;

            console.log('Current random number: ' + generateRandomNumber);
        }

        console.log(`It takes about ${counter} amount to reach ${stopAtNumber}`);

    </script>
</body>
</html>
