        const users = [
            'Mario',
            'Luigi',
            'Bowser',
            'Yoshi',
            'Daisy'
        ];

        function greet(user) {
            user.forEach(person => {
                console.log(`Hello and welcome back, ${person}`);
            })
        }

        greet(users);

        const anotherUsers = [
            'theradbrad', 
            'gameranx', 
            'john doe', 
            'john wick',
            'potter'
        ]

        greet(anotherUsers)
