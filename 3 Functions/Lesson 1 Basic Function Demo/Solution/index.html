<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Function</title>
</head>
<body>
    <script>

        /* 
        
            3 minutes
            
            #1 Create a basic function of greet with parameter of user, as for the code block
               leave it empty
            
            #2 In the code block of greet function, create a loop for each array item inside
               the users array and log it as below

               'Hello and welcome back, Mario'

            #3 Call the greet function with argument of users

            #4 Create another array of anotherUser with values of
               theradbrad, gameranx, john doe, john wick and potter

            #5 Call the greet function with argument of anotherUser

        */ 

        // Type your code below:

        const users = [
            'Mario',
            'Luigi',
            'Bowser',
            'Yoshi',
            'Daisy'
        ];

        function greet(user) {
            user.forEach(person => {
                console.log(`Hello and welcome back, ${person}`);
            })
        }

        greet(users);

        const anotherUsers = [
            'theradbrad', 
            'gameranx', 
            'john doe', 
            'john wick',
            'potter'
        ]

        greet(anotherUsers)

    </script>
</body>
</html>
