<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conditional Flow</title>
</head>
<body>
    <script>

        // 5 minutes

        /*

            Instructions:

            # 1. Create two object of user_1 and user_2 with object key of username, email and premium.
                 Add values to user_1 username = mario27, email = mario@kingdomhearts.com and premium to false
                 Add values to user_2 username = yoshinewb29, email is empty value and premium to true
            
            # 2. Create a condition to check if user_1 & user_2 is subscribed to premium.
                 You can log if they subscribe as 'Thank you for subscribing with us'
                 You can log if they didn't subscribe as 'We hope you consider our promotion'
                 For this, use only one if..else statement not two to check both users premium
        
        
        */

        // Type your solutions below:

        const user_1 = { 
            username: 'mario27',
            email: 'mario@kingdomhearts.com',
            premium: false
        }

        const user_2 = {
            username: 'yoshinewb29',
            email: '',
            premium: true
        }

        let checkUser = user_2;

        if(checkUser.premium){
            console.log('Thank you for subscribing with us');
        } else {
            console.log('We hope you consider our promotion');
        }

    </script>
</body>
</html>
