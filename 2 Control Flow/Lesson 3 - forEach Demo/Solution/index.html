<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forEach</title>
</head>
<body>
    <script>

        /*

            2 minutes

            # 1. Create an array of fruits with values of apple, banana, mango

            # 2. Use forEach to loop each value
            
        
        
        */

        // Type your solutions below:

        const fruits = ['apple', 'banana', 'mango'];

        fruits.forEach((fruit, index) => {
            console.log(`${index}: ${fruit}`);
        })
        

    </script>
</body>
</html>
