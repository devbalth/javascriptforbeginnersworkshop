<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>continue and break</title>
</head>
<body>
    <script>

        /*

            3 minutes

            # 1. Create an array of youtube channel with values of object

                { channel: 'Bizarre Bob', rating: 9 }
                { channel: 'Nukes top 5', rating: 8 }
                { channel: 'Gameranx', rating: 7.5 }
                { channel: 'Linus Tech Tips', rating: 6.5 }
                { channel: 'Burnt Peanut', rating: 10 }
            
            # 2. Use any loop that can use continue and break
                 Create a new array invitation
                 Push the object with rating of 8 and above
                 Also push the object if there is Linus Tech Tips
                 Break the loop if the channel reach 'Burnt Peanut' 
                 as we don't want to invite a peanut to the event
            
        
        */

        // Type your solutions below:

        const youtubeChannel = [
            { channel: 'Bizarre Bob', rating: 9 },
            { channel: 'Nukes top 5', rating: 8 },
            { channel: 'Gameranx', rating: 7.5 },
            { channel: 'Linus Tech Tips', rating: 6.5 },
            { channel: 'Burnt Peanut', rating: 10 }
        ]

        const invitation = [];

        for(const youtuber of youtubeChannel){
            
            if(youtuber.channel == 'Linus Tech Tips'){
                invitation.push(youtuber);
            }

            if(youtuber.rating < 8){
                continue;
            }

            if(youtuber.channel == 'Burnt Peanut'){
                break;
            }

            invitation.push(youtuber);

        }

        console.log(invitation);
        

    </script>
</body>
</html>
