<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for..of</title>
</head>
<body>
    <script>

        /*

            3 minutes

            # 1. Create an array of movies with values of object

                { title: 'Spider-Moon: Brand new Sun', rating: 6 }
                { title: 'Summer to Winter', rating: 8 }
                { title: 'Startcraft The Movie', rating: 10 }

            # 2. Use for..of to loop the movies array, use console.log() to log each object

            # 3. Use for..of to loop the movies, and push the array item to
                 a new array variable topMovies2026 and with the following template
                 'Top 1: Spider-Moon: Brand new Sun, imdb rating 6/10'
                 'Top 2: Summer to Winter, imdb rating 8/10'
                 'Top 3: Starcraft The Movie, imdb rating 10/10'
        
        */

        // Type your solutions below:

        const movies = [
            { title: 'Spider-Moon: Brand new Sun', rating: 6 },
            { title: 'Summer to Winter', rating: 8 },
            { title: 'Startcraft The Movie', rating: 10 }
        ];

        for(const movie of movies){
            console.log(movie);
        }

        let topMovies2026 = []
        let count = 1;

        for(const movie of movies){

            topMovies2026.push(`Top ${count}: ${movie.title}, imdb rating ${movie.rating}/10`);

            count++;
        }

        console.log(topMovies2026);

        

    </script>
</body>
</html>
